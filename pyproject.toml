[project]
name = "system1"
version = "0.1.0"
description = "When should a small model ask for help? System One judges for a small thinking model's code-repair loop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "evalplus>=0.3.1",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
jev-smoke = "system1.routers.jev_smoke:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/system1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
